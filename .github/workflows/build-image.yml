name: Build and push S5A3 Gateway image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Source branch in this repo to build
        required: true
        type: string
        default: feature/s5a3-standalone
  push:
    branches: [main, master]

permissions:
  contents: read
  packages: write

env:
  DEFAULT_REF: feature/s5a3-standalone
  IMAGE: ghcr.io/oyxp233/s5a3-gateway

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'feature/s5a3-standalone' }}

      - name: Use fixed Dockerfile
        run: |
          # 源码分支里的旧 Dockerfile 是 S4A21 时代的，必须用 main 上的修复版覆盖。
          # 修复版产出 s5a3-gateway + s5a3-admin，并把 wwwroot 打进镜像。
          curl -fsSL https://raw.githubusercontent.com/oyxp233/Gateway-GO/main/docker/Dockerfile -o Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.run_number }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}

      - name: Make package public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "/user/packages/container/$(basename "$IMAGE")/visibility" \
            -f visibility=public
